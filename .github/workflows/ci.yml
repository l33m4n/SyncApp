name: CI

# Every push and pull request: build and test on Windows, keep SyncApp.exe as a build artifact.
#
# Pushes to main additionally:
#   1. pick the next version automatically: the last published version + 1, or the version in
#      Cargo.toml if that is higher (edit Cargo.toml to start e.g. 0.2.0);
#   2. build SyncApp.exe with that version;
#   3. replace the rolling GitHub release tagged "release" ("SyncApp X.Y.Z") with the new exe
#      and its SHA-256 checksum. Installed copies of SyncApp pick it up with their update check.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Builds of the same branch run one at a time, so versions never collide.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the next version (main only)
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(grep -m1 -E '^version *= *"' Cargo.toml | cut -d'"' -f2)
          prev=$(gh release view release --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null \
                 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          # a > b for x.y.z versions
          gt() {
            IFS=. read -r a1 a2 a3 <<< "$1"; IFS=. read -r b1 b2 b3 <<< "$2"
            [ "$a1" -gt "$b1" ] && return 0; [ "$a1" -lt "$b1" ] && return 1
            [ "$a2" -gt "$b2" ] && return 0; [ "$a2" -lt "$b2" ] && return 1
            [ "$a3" -gt "$b3" ]
          }
          next="$base"
          if [ -n "$prev" ]; then
            IFS=. read -r p1 p2 p3 <<< "$prev"
            bumped="$p1.$p2.$((p3 + 1))"
            if ! gt "$base" "$bumped"; then next="$bumped"; fi
          fi
          echo "Cargo.toml: $base, last published: ${prev:-none}, building: $next"
          sed -i "0,/^version *= *\".*\"/s//version = \"$next\"/" Cargo.toml
          echo "value=$next" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --all-targets

      - name: Build
        run: cargo build --release

      - name: Upload SyncApp.exe
        uses: actions/upload-artifact@v4
        with:
          name: SyncApp
          path: target/release/SyncApp.exe
          if-no-files-found: error

  release:
    name: Publish rolling release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SyncApp
          path: dist

      - name: Replace the "release" release with SyncApp ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum SyncApp.exe > SyncApp.exe.sha256
          cat SyncApp.exe.sha256
          {
            echo "SyncApp $VERSION, built automatically from commit ${GITHUB_SHA::7}."
            echo
            echo "Latest change:"
            echo
            echo "$COMMIT_MESSAGE"
          } > notes.md
          gh release delete release --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create release SyncApp.exe SyncApp.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SyncApp $VERSION" \
            --notes-file notes.md \
            --latest
