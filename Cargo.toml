[package]
name = "syncapp"
version = "0.1.0"
edition = "2024"
description = "Automatic, verified backups to marked external drives"
license = "MIT"

[[bin]]
name = "SyncApp"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.37", default-features = false }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Time", "Win32_System_ProcessStatus", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
